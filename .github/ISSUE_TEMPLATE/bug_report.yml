name: Bug report
description: Report a reproducible problem in RokuDeck
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve RokuDeck. Remove device addresses, serials, MAC addresses, network names, and credentials before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RokuDeck version or commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include distribution, Plasma, Qt, rds, and relevant package versions without private identifiers.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only logs that have been checked for private device and network identifiers.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed device addresses, serials, MAC addresses, network names, and credentials.
          required: true
