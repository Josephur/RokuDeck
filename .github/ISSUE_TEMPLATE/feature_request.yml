# SPDX-License-Identifier: GPL-3.0-or-later

name: Feature request
description: Propose a focused improvement to RokuDeck
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need or limitation without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe how a user would know the improvement works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or related approaches you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This request keeps RokuDeck local-first and does not require telemetry or a cloud account.
          required: true
